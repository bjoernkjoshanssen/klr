name = "klr"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Klr"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Keep proof/style checks without imposing Mathlib's copyright/license header format.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Klr"
