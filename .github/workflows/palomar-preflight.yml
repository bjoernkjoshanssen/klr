name: Palomar full preflight

# This is the complete registry workflow, distinct from the standalone
# Comparator check. It requires a chosen licence and matching root LICENSE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - LICENSE
      - formalization.yaml
      - comparator.json
      - Challenge.lean
      - Solution.lean
      - .github/workflows/palomar-preflight.yml

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
